name: Authentication Service CI/CD Task

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'authentication_service/**'
      - '.github/workflows/auth-service-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'authentication_service/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    # if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-lint-${{ hashFiles('authentication_service/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-lint-
    
    - name: Install linting tools
      working-directory: authentication_service
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort bandit pylint
    
    - name: Run flake8
      continue-on-error: true
      working-directory: authentication_service
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Check code formatting with Black
      continue-on-error: true
      working-directory: authentication_service
      run: black --check --diff .
    
    - name: Check import ordering with isort
      continue-on-error: true
      working-directory: authentication_service
      run: isort --check-only --diff .
    
    - name: Security check with bandit
      continue-on-error: true
      working-directory: authentication_service
      run: bandit -r . -f json -o bandit-report.json
    
    - name: Run pylint
      continue-on-error: true
      working-directory: authentication_service
      run: pylint **/*.py --disable=all --enable=E,F


  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    env:
      DATABASE_URL: sqlite:///test.db
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-test-${{ matrix.python-version }}-${{ hashFiles('authentication_service/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-test-${{ matrix.python-version }}-
    
    - name: Install dependencies
      working-directory: authentication_service
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run tests with coverage
      working-directory: authentication_service
      # env:
      #   DATABASE_URL: sqlite:///test.db
      run: |
        python -m pytest tests/test_auth.py -v --tb=short --cov=. --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.9'
      uses: codecov/codecov-action@v3
      with:
        files: ./authentication_service/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Generate and upload HTML coverage report
      if: matrix.python-version == '3.9'
      working-directory: authentication_service
      run: python -m pytest tests/test_auth.py --cov=. --cov-report=html
    
    - name: Upload HTML coverage report as artifact
      if: matrix.python-version == '3.9'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: authentication_service/htmlcov/
        retention-days: 7


  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        working-directory: authentication_service
        run: |
          docker build -t auth-service:latest .


  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Deploy the application
        working-directory: authentication_service
        run: |
          echo "Deploying to production..."
