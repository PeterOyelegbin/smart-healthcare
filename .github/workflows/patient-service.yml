name: Patient Service CI/CD Task

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'patient_service/**'
      - '.github/workflows/patient-service.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'patient_service/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-lint-${{ hashFiles('patient_service/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-lint-
    
    - name: Install linting tools
      working-directory: patient_service
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort bandit pylint
    
    - name: Run flake8
      continue-on-error: true
      working-directory: patient_service
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Check code formatting with Black
      continue-on-error: true
      working-directory: patient_service
      run: black --check --diff .
    
    - name: Check import ordering with isort
      continue-on-error: true
      working-directory: patient_service
      run: isort --check-only --diff .
    
    - name: Security check with bandit
      continue-on-error: true
      working-directory: patient_service
      run: bandit -r . -f json -o bandit-report.json
    
    - name: Run pylint
      continue-on-error: true
      working-directory: patient_service
      run: pylint **/*.py --disable=all --enable=E,F


  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_HOST: ${{ vars.REDIS_HOST }}
      REDIS_PORT: ${{ vars.REDIS_PORT }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ALGORITHM: ${{ secrets.ALGORITHM }}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${{ vars.ACCESS_TOKEN_EXPIRE_MINUTES }}
      REFRESH_TOKEN_EXPIRE_DAYS: ${{ vars.REFRESH_TOKEN_EXPIRE_DAYS }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM_NAME: ${{ vars.EMAIL_FROM_NAME }}
      PASSWORD_RESET_TOKEN_EXPIRE_MINUTES: ${{ vars.PASSWORD_RESET_TOKEN_EXPIRE_MINUTES }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      YOUVERIFY_API_URL: ${{ vars.YOUVERIFY_API_URL }}
      YOUVERIFY_API_KEY: ${{ secrets.YOUVERIFY_API_KEY }}
      DOJAH_API_URL: ${{ vars.DOJAH_API_URL }}
      DOJAH_API_KEY: ${{ secrets.DOJAH_API_KEY }}
      DOJAH_APP_ID: ${{ secrets.DOJAH_APP_ID }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-test-${{ matrix.python-version }}-${{ hashFiles('patient_service/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-test-${{ matrix.python-version }}-
    
    - name: Install dependencies
      working-directory: patient_service
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run tests with coverage
      working-directory: patient_service
      # env:
      #   DATABASE_URL: sqlite:///test.db
      run: |
        python -m pytest tests/test_auth.py -v --tb=short --cov=. --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.9'
      uses: codecov/codecov-action@v3
      with:
        files: ./patient_service/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Generate and upload HTML coverage report
      if: matrix.python-version == '3.9'
      working-directory: patient_service
      run: python -m pytest tests/test_auth.py --cov=. --cov-report=html
    
    - name: Upload HTML coverage report as artifact
      if: matrix.python-version == '3.9'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: patient_service/htmlcov/
        retention-days: 7


  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        working-directory: patient_service
        run: |
          docker build -t patient-service:latest .


  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Deploy the application
        working-directory: patient_service
        run: |
          echo "Deploying to production..."
